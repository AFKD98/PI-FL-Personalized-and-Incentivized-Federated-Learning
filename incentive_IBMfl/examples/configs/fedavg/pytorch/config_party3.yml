aggregator:
  ip: 192.168.0.231
  port: 5000
connection:
  info:
    ip: 192.168.0.232
    port: 8088
    tls_config:
      enable: false
  name: FlaskConnection
  path: ibmfl.connection.flask_connection
  sync: false
data:
  info:
    npz_file: examples/data/cifar10/balanced/data_party3.npz
  name: Cifar10PytorchDataHandler
  path: ibmfl.util.data_handlers.cifar10_pytorch_data_handler
hyperparams:
  tiers: 5
local_training:
  name: TierFedAvgLocalTrainingHandler
  path: ibmfl.party.training.tier_fedavg_local_training_handler
model:
  name: PytorchFLModel
  path: ibmfl.model.pytorch_fl_model
  spec:
    loss_criterion: nn.NLLLoss
    model_definition: examples/configs/fedavg/pytorch/pytorch_sequence.pt
    model_name: pytorch-nn
    optimizer: optim.Adadelta
privacy:
  metrics: true
protocol_handler:
  name: PartyProtocolHandler
  path: ibmfl.party.party_protocol_handler
